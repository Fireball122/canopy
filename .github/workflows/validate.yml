name: Validate Canopy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        run: npm ci

      # Same gate developers and the pre-commit hook run (version consistency, tsc, Biome,
      # Vite build, warnings-as-errors .NET build), executed under Windows PowerShell 5.1 so
      # the scripts stay compatible with the shell shipped in Windows.
      - name: Run verification cage
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./verify.ps1
