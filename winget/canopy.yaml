ShortDescription: Fluid Zero-Notch Top Hover Desktop Control Center & Wallpaper Switcher
Description: |
  Canopy is a lightweight, zero-idle-footprint Windows 11 desktop overlay application inspired by Caelestia Shell and Wayland compositors.
  Moving the mouse cursor to the top center edge of the screen smoothly slides down a frosted-glass, rounded control center panel with audio telemetry, music scrubber with synced lyrics, quick launch dock, and wallpaper switcher.
